<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Background -->
  <rect width="256" height="256" rx="40" fill="#1a3a5c"/>

  <!-- Document shape -->
  <rect x="60" y="40" width="136" height="170" rx="10" fill="#ffffff" opacity="0.95"/>
  <rect x="60" y="40" width="136" height="170" rx="10" fill="none" stroke="#4a90d9" stroke-width="3"/>

  <!-- Folded corner -->
  <polygon points="156,40 196,80 156,80" fill="#4a90d9" opacity="0.5"/>
  <polyline points="156,40 156,80 196,80" fill="none" stroke="#4a90d9" stroke-width="3"/>

  <!-- Horizontal lines (document content) -->
  <line x1="80" y1="105" x2="175" y2="105" stroke="#1a3a5c" stroke-width="6" stroke-linecap="round"/>
  <line x1="80" y1="125" x2="175" y2="125" stroke="#1a3a5c" stroke-width="6" stroke-linecap="round"/>
  <line x1="80" y1="145" x2="155" y2="145" stroke="#1a3a5c" stroke-width="6" stroke-linecap="round"/>

  <!-- Checkmark / stamp circle -->
  <circle cx="148" cy="178" r="30" fill="#2ecc71"/>
  <polyline points="133,178 144,190 165,165" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
