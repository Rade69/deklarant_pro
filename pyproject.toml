[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asycuda-pro"
version = "0.1.0"
description = "ASYCUDA Pro - Aplikacija za carinske deklaracije"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6.0",
    "openpyxl>=3.1.0",
    "PyPDF2>=3.0.0",
    "lxml>=4.9.0",
]

[project.scripts]
asycuda-pro = "app:main"

[tool.setuptools]
py-modules = []
