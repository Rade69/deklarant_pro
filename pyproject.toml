[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deklarant-pro"
version = "0.1.0"
description = "Deklarant Pro - Aplikacija za carinske deklaracije"
requires-python = ">=3.10"
dependencies = [
    # GUI Framework
    "PySide6>=6.6.0",
    # Database
    "psycopg2-binary>=2.9.7",
    # Configuration Management
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    # Security / Licensing
    "cryptography>=42.0.0",
    # PDF Processing
    "pdfplumber>=0.11.10",
    # Excel Processing
    "openpyxl>=3.1.0",
    # XML Processing
    "lxml>=4.9.0",
    # Logging and Utilities
    "colorama>=0.4.6",
    # Qt Utilities
    "qtawesome>=1.3.0",
    # PDF Export
    "reportlab>=4.0.0",
    # Excel (stari .xls format)
    "xlrd>=2.0.0",
    # HTTP klijent
    "requests>=2.28.0",
    # Fuzzy matching (parseri, tarife)
    "rapidfuzz>=3.0.0",
    # AI Agent
    "anthropic>=0.50.0",
    "openai>=1.0.0",
    "groq>=1.0.0",
    "google-generativeai>=0.8.0",
    "mcp>=1.0.0",
    "ollama>=0.1.0",
]

[project.optional-dependencies]
# OCR podrška za skenirane PDF-ove (zahtijeva Tesseract sistemski paket)
# Instalacija: uv sync --extra ocr
ocr = [
    "pytesseract>=0.3.10",
    "pdf2image>=1.16.3",
    "Pillow>=10.0.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
]
# Dev/test zavisnosti
# Instalacija: uv sync --extra dev
dev = [
    "pytest>=7.4.0",
    "pytest-qt>=4.2.0",
]
# Lokalni embedding provider za product_similarity_memory ("slični proizvodi")
# Instalacija: uv sync --extra embeddings
embeddings = [
    "sentence-transformers>=2.2.0",
]

[project.scripts]
deklarant-pro = "app:main"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
markers = [
    "integration: tests that require PostgreSQL or external services",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-qt>=4.2.0",
]
